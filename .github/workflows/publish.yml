name: Publish NuGet Package

# Builds and publishes QPAC.Sculptor to the public nuget.org gallery on every push.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest   # core targets net7.0/netstandard2.0 — no Windows/WPF needed
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Restore
        run: dotnet restore "QPAC Sculptor/QPAC Sculptor.csproj"

      # GeneratePackageOnBuild=true in the csproj, so the build produces the .nupkg.
      # PackageOutputPath is overridden here so it lands in a known, repo-local folder.
      - name: Build & pack
        run: dotnet build "QPAC Sculptor/QPAC Sculptor.csproj" -c Release --no-restore -p:Version=1.0.${{ github.run_number }} -p:PackageOutputPath="${{ github.workspace }}/artifacts"

      # Publishes to the public nuget.org gallery. Create an API key at
      # https://www.nuget.org/account/apikeys (scope: Push, glob QPAC.Sculptor*)
      # and store it as the repo secret NUGET_API_KEY.
      - name: Push to nuget.org
        run: >
          dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg"
          --source "https://api.nuget.org/v3/index.json"
          --api-key ${{ secrets.NUGET_API_KEY }}
          --skip-duplicate
