name: Build, test and publish

# Every push and PR builds and runs the tests. Pushes to master (or a manual run) also publish
# QPAC.Sculptor to the private qpacsystems GitHub Packages feed. The package version is the
# <Version> in src/QPAC.Sculptor/QPAC.Sculptor.csproj: bump it to release; an unchanged version
# is skipped, not failed.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FEED: https://nuget.pkg.github.com/qpacsystems/index.json

jobs:
  build:
    runs-on: ubuntu-latest   # core targets net7.0/netstandard2.0 — no Windows needed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            7.0.x
            8.0.x

      - name: Restore
        run: dotnet restore QPAC.Sculptor.sln

      - name: Test
        run: dotnet test QPAC.Sculptor.sln -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Pack
        run: dotnet pack src/QPAC.Sculptor/QPAC.Sculptor.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg

      # The repo lives under a personal account, so the built-in GITHUB_TOKEN cannot write to the
      # qpacsystems org feed: QPAC_PACKAGES_PAT is a classic PAT with write:packages.
      - name: Push to qpacsystems GitHub Packages
        if: github.event_name != 'pull_request'
        env:
          QPAC_PACKAGES_PAT: ${{ secrets.QPAC_PACKAGES_PAT }}
        run: |
          if [ -z "$QPAC_PACKAGES_PAT" ]; then
            echo "::error::Repository secret QPAC_PACKAGES_PAT is not set (classic PAT with write:packages for qpacsystems)."
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" --source "$FEED" --api-key "$QPAC_PACKAGES_PAT" --skip-duplicate
